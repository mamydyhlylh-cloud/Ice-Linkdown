<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به مجموعه یخی ❄️</title>
<style>
  body {
    margin: 0;
    font-family: 'Vazir', sans-serif;
    background: linear-gradient(180deg, #e0f7ff, #aee4ff);
    height: 100vh;
    overflow: hidden;
    color: #003366;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  /* انیمیشن برف */
  .snowflake {
    position: fixed;
    top: -10px;
    z-index: 1;
    color: #fff;
    font-size: 1.4em;
    animation: fall 10s linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
  }

  h1 {
    font-size: 2.3em;
    margin-bottom: 10px;
    color: #004c80;
    text-shadow: 0 0 10px #ffffff;
  }

  p {
    font-size: 1.1em;
    line-height: 1.8;
    margin: 15px 20px;
    color: #003d66;
  }

  .btn {
    background: #00bfff;
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 1.2em;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(0,191,255,0.5);
  }

  .btn:hover {
    background: white;
    color: #0072ff;
    box-shadow: 0 0 25px #00bfff;
  }

  footer {
    position: absolute;
    bottom: 15px;
    font-size: 0.95em;
    color: #005580;
  }
</style>
</head>
<body>

  <!-- برف‌های متحرک -->
  <div class="snowflake" style="left:10%">❄️</div>
  <div class="snowflake" style="left:25%">❄️</div>
  <div class="snowflake" style="left:40%">❄️</div>
  <div class="snowflake" style="left:55%">❄️</div>
  <div class="snowflake" style="left:70%">❄️</div>
  <div class="snowflake" style="left:85%">❄️</div>

  <h1>به مجموعه یخی خوش اومدی ❄️</h1>
  <p>
    دنیای سرد ولی پر از هیجان تبلیغات و ارتباطات اینجاست!  
    جایی برای رشد، دیده شدن و ساختن ارتباط‌های خنک و واقعی 🧊  
    <br>
    فقط کافیه وارد بشی تا سرمای جذاب ما رو حس کنی...
  </p>

  <a href="index.html">
    <button class="btn">ورود به مجموعه یخی</button>
  </a>

  <footer>طراحی و ساخت با ❄️ توسط <strong>مسلم</strong></footer>

</body>
</html>
